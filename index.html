<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b5d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Kanuslalom Timer</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#183047;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#123b5d;color:white;padding:18px 16px}header h1{font-size:22px;margin:0}.header-content{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:800px;margin:auto}.header-logo{width:58px;height:58px;object-fit:contain;flex-shrink:0}header small{opacity:.8}main{max-width:800px;margin:auto;padding:12px}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:14px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px;background:#e7edf3;color:#183047}button:disabled{opacity:.45}nav button{font-size:12px;padding:12px 3px}nav .active{background:#123b5d;color:white}.card{background:white;border:1px solid #dce3e9;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px #142c4210}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.delete-athlete{background:transparent;color:#607384;padding:6px 9px;font-size:23px;line-height:1;border-radius:8px;flex-shrink:0}.delete-athlete:hover{background:#e7edf3}.top input{min-width:0;flex:1;font-size:17px;font-weight:650;border:1px solid #dde3e9;border-radius:8px;padding:8px}.time{font-size:38px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;margin:12px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions .start{grid-column:1/-1;background:#15803d;color:white;font-weight:700;font-size:18px}.actions .stop{background:#b91c1c}.save{background:#125a92;color:white}.danger-reset{background:#b91c1c;color:white;width:100%;margin-top:12px;font-weight:700}.danger-reset:hover{background:#991b1b}.muted{color:#607384;font-size:13px}.summary{margin:10px 0}.expand{width:100%;text-align:left;display:flex;justify-content:space-between;margin-top:8px}.gate-scroll{max-height:250px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.gate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.gate-card{border:1px solid #dce3e9;border-radius:10px;padding:8px}.gate-card .row{margin-bottom:7px}.gate-name{display:inline-flex;align-items:center;justify-content:center;background:#15803d;color:white;font-weight:700;border-radius:6px;min-width:42px;min-height:36px}.up{background:#b91c1c!important}.gate-actions{display:grid;grid-template-columns:1fr 1fr 32px;gap:4px}.gate-actions button{padding:9px 2px}.chosen{background:#125a92;color:white}.add{width:100%;border:1px dashed #8398a8;background:white}.setup-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.setup-item{min-width:0}.setup-item button{width:100%;height:52px;background:#15803d;color:white;font-size:17px;font-weight:700}.setup-item input{width:100%;text-align:center;padding:7px 1px;margin-top:3px;border:1px solid #ccd6df;border-radius:7px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 3px;border-bottom:1px solid #e3e9ef}th:last-child,td:last-child{text-align:right}h2{font-size:18px;margin:4px 0 14px}h3{margin:0 0 10px;font-size:16px}.small-btn{padding:6px 10px}.file{display:block;margin:10px 0}.hidden{display:none}.pdf-report{display:none}@media print{@page{size:A4;margin:15mm}header,main{display:none!important}.pdf-report{display:block!important;color:#172a3b;font-family:Arial,sans-serif;font-size:10pt}.pdf-report h1{font-size:20pt;margin:0 0 8mm}.pdf-report h2{font-size:14pt;margin:8mm 0 3mm}.pdf-report h3{font-size:12pt;margin:6mm 0 2mm}.pdf-report table{width:100%;font-size:9pt;border-collapse:collapse}.pdf-report th{background:#e7edf3}.pdf-report th,.pdf-report td{border-bottom:1px solid #ccd6df;padding:6px;text-align:left}.pdf-report th:last-child,.pdf-report td:last-child{text-align:right}.pdf-report section{break-inside:avoid}.pdf-report .subnote{font-size:9pt;color:#4a6071}}.note{font-size:12px;color:#657787;margin:12px 2px} @media(max-width:360px){.time{font-size:32px}.gate-grid{gap:5px}.gate-card{padding:5px}}
</style></head><body><header><div class="header-content"><div><h1>Kanuslalom Timer</h1><small>Trainingszeitmessung</small></div><img class="header-logo" src="logo-header.png" alt="AKV Logo"></div></header><main><nav id="nav"></nav><div id="content"></div><p class="note">Die Daten werden lokal auf diesem Gerät gespeichert. Ergebnisse können als PDF gespeichert werden. Das Löschen der App-Daten entfernt die lokalen Ergebnisse.</p></main><div id="pdf-report" class="pdf-report"></div><script>
const KEY='kanuslalom-timer-v1';const makeGates=()=>Array.from({length:25},(_,i)=>({id:i+1,num:String(i+1).padStart(2,'0'),up:false}));const newAthlete=(id,name)=>({id,name,elapsed:0,start:null,running:false,penalties:{},runs:[],expanded:false});const defaults=()=>({gates:makeGates(),gateCount:18,athletes:[newAthlete(1,'Sportler 1'),newAthlete(2,'Sportler 2')]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}let tab='timing';const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=ms=>{let n=Math.floor(Math.max(0,ms)/10);return `${String(Math.floor(n/6000)).padStart(2,'0')}:${String(Math.floor(n/100)%60).padStart(2,'0')}.${String(n%100).padStart(2,'0')}`};const elapsed=a=>a.elapsed+(a.running?Math.max(0,Date.now()-a.start):0);const pen=a=>Object.values(a.penalties).reduce((s,v)=>s+Number(v),0);const saveState=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen und Daten exportieren.')}};const athlete=id=>data.athletes.find(a=>a.id===id);const gateCard=(a,g)=>{let p=a.penalties[g.id]||0;return `<div class="gate-card"><div class="row"><span class="gate-name ${g.up?'up':''}">${escapeHTML(g.num)}</span><small>+${p} s</small></div><div class="gate-actions"><button class="${p===2?'chosen':''}" data-action="pen" data-id="${a.id}" data-gate="${g.id}" data-val="2">+2</button><button class="${p===50?'chosen':''}" data-action="pen" data-id="${a.id}" data-gate="${g.id}" data-val="50">+50</button><button data-action="pen" data-id="${a.id}" data-gate="${g.id}" data-val="0">↶</button></div></div>`};
function render(){
 const scrollPositions=new Map();if(tab==='timing')document.querySelectorAll('.gate-scroll[data-athlete]').forEach(el=>scrollPositions.set(el.dataset.athlete,el.scrollTop));
 $('nav').innerHTML=[['timing','⏱ Zeitmessung'],['gates','🚩 Tore'],['ranking','🏆 Rangliste'],['results','📋 Ergebnisse']].map(([id,name])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${name}</button>`).join('');let html='';if(tab==='timing'){html=data.athletes.map(a=>`<section class="card"><div class="top"><input aria-label="Sportlername" data-name="${a.id}" value="${escapeHTML(a.name)}"><small>Lauf ${a.runs.length+1}</small><button class="delete-athlete" data-action="delete" data-id="${a.id}" aria-label="${escapeHTML(a.name)} entfernen" title="Sportler entfernen">×</button></div><div class="time" id="clock-${a.id}">${fmt(elapsed(a))}</div><div class="actions"><button class="start ${a.running?'stop':''}" data-action="toggle" data-id="${a.id}">${a.running?'■ Stopp':'▶ Start'}</button><button class="save" data-action="save" data-id="${a.id}" ${a.running||a.elapsed===0?'disabled':''}>💾 Speichern & Reset</button><button data-action="reset" data-id="${a.id}">↶ Nur Reset</button></div><div class="row summary"><small id="pen-${a.id}">Strafzeit: +${pen(a)} s</small><strong id="total-${a.id}">Gesamt: ${fmt(elapsed(a)+pen(a)*1000)}</strong></div><button class="expand" data-action="expand" data-id="${a.id}">🚩 Torfehler ${a.expanded?'ausblenden':'anzeigen'} <span>${Object.keys(a.penalties).length} Fehler ${a.expanded?'⌃':'⌄'}</span></button>${a.expanded?`<div class="gate-scroll" data-athlete="${a.id}"><div class="gate-grid">${data.gates.slice(0,data.gateCount).map(g=>gateCard(a,g)).join('')}</div></div>`:''}</section>`).join('')+`<button class="add" data-action="add">+ Sportler hinzufügen</button>`}else if(tab==='gates'){html=`<section class="card"><h2>Streckenkonfiguration</h2><div class="row"><span>Anzahl der Tore</span><div><button data-action="count" data-delta="-1">−</button> <strong>${data.gateCount}</strong> <button data-action="count" data-delta="1">+</button></div></div><p class="muted">Tor antippen: grün = Abwärtstor, rot = Aufwärtstor. Nummern darunter bearbeiten (00–99).</p><div class="setup-grid">${data.gates.slice(0,data.gateCount).map(g=>`<div class="setup-item"><button class="${g.up?'up':''}" data-action="color" data-gate="${g.id}">${escapeHTML(g.num)}</button><input aria-label="Tornummer" inputmode="numeric" maxlength="2" data-gatenum="${g.id}" value="${escapeHTML(g.num)}"></div>`).join('')}</div><p><button data-action="resetgates">Tore zurücksetzen</button></p></section>`}else if(tab==='ranking'){let ranked=data.athletes.filter(a=>a.runs.length).map(a=>({a,best:a.runs.reduce((x,y)=>y.total<x.total?y:x)})).sort((x,y)=>x.best.total-y.best.total);html=`<section class="card"><h2>Rangliste – bester Lauf</h2>${ranked.length?`<table><tr><th>Pl.</th><th>Sportler</th><th>Lauf</th><th>Strafe</th><th>Gesamt</th></tr>${ranked.map(({a,best},i)=>`<tr><td>${i+1}</td><td>${escapeHTML(a.name)}</td><td>${best.number}</td><td>+${best.penalty}s</td><td>${fmt(best.total)}</td></tr>`).join('')}</table>`:'Noch keine gespeicherten Läufe.'}</section>`}else{html=`<h2>Gespeicherte Ergebnisse</h2>`+data.athletes.map(a=>`<section class="card"><h3>${escapeHTML(a.name)} · ${a.runs.length} Läufe</h3>${a.runs.length?`<table><tr><th>Lauf</th><th>Fahrzeit</th><th>Strafe</th><th>Gesamt</th></tr>${a.runs.map(r=>`<tr><td>${r.number}</td><td>${fmt(r.elapsed)}</td><td>+${r.penalty}s</td><td>${fmt(r.total)}</td></tr>`).join('')}</table>${a.runs.filter(r=>Object.keys(r.penalties).length).map(r=>`<p class="muted">Lauf ${r.number}: ${Object.entries(r.penalties).map(([id,p])=>`Tor ${escapeHTML(r.gateLabels?.[id]||id)} (+${p}s)`).join(', ')}</p>`).join('')}`:'Noch keine Ergebnisse gespeichert.'}</section>`).join('')+`<section class="card"><h3>PDF-Bericht</h3><p class="muted">Rangliste und alle gespeicherten Läufe der Sportler als PDF ausgeben.</p><button class="save" data-action="pdf">📄 Ergebnisse exportieren</button><button class="danger-reset" data-action="resetall">↶ App komplett zurücksetzen</button></section>`} $('content').innerHTML=html;if(tab==='timing')document.querySelectorAll('.gate-scroll[data-athlete]').forEach(el=>{if(scrollPositions.has(el.dataset.athlete))el.scrollTop=scrollPositions.get(el.dataset.athlete)})}

function exportPDF(){
 const ranked=data.athletes.filter(a=>a.runs.length).map(a=>({a,best:a.runs.reduce((x,y)=>y.total<x.total?y:x)})).sort((x,y)=>x.best.total-y.best.total);
 const table=(headers,rows)=>`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
 const rankingTable=ranked.length?table(['Platz','Sportler','Lauf','Fahrzeit','Strafe','Gesamtzeit'],ranked.map(({a,best},i)=>[i+1,escapeHTML(a.name),best.number,fmt(best.elapsed),`+${best.penalty} s`,fmt(best.total)])):'Noch keine gespeicherten Läufe.';
 const results=data.athletes.map(a=>`<section><h3>${escapeHTML(a.name)}</h3>${a.runs.length?table(['Lauf','Fahrzeit','Strafe','Gesamtzeit'],a.runs.map(r=>[r.number,fmt(r.elapsed),`+${r.penalty} s`,fmt(r.total)]))+a.runs.filter(r=>Object.keys(r.penalties).length).map(r=>`<p class="subnote">Lauf ${r.number}: ${Object.entries(r.penalties).map(([id,p])=>`Tor ${escapeHTML(r.gateLabels?.[id]||data.gates.find(g=>g.id===Number(id))?.num||id)} (+${Number(p)} s)`).join(', ')}</p>`).join(''):'Noch keine gespeicherten Läufe.'}</section>`).join('');
 $('pdf-report').innerHTML=`<h1>Kanuslalom – Trainingsergebnisse</h1><p>Erstellt am ${new Date().toLocaleString('de-DE')}</p><h2>Rangliste – bester Lauf pro Sportler</h2>${rankingTable}<h2>Einzelergebnisse</h2>${results}`;
 window.print();
}

function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-action]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}let action=b.dataset.action,id=Number(b.dataset.id),a=athlete(id),g=Number(b.dataset.gate);if(action==='toggle'){if(a.running){a.elapsed=elapsed(a);a.start=null;a.running=false}else{a.start=Date.now();a.running=true}}else if(action==='save'){if(a.running||a.elapsed<=0)return;let p=pen(a);a.runs.push({number:a.runs.length+1,elapsed:a.elapsed,penalties:{...a.penalties},gateLabels:Object.fromEntries(data.gates.map(g=>[g.id,g.num])),penalty:p,total:a.elapsed+p*1000});a.elapsed=0;a.start=null;a.running=false;a.penalties={}}else if(action==='reset'){if(!confirm(`Aktuellen Lauf von ${a.name} ohne Speichern verwerfen?`))return;a.elapsed=0;a.start=null;a.running=false;a.penalties={}}else if(action==='expand'){a.expanded=!a.expanded}else if(action==='pen'){if(Number(b.dataset.val)===0)delete a.penalties[g];else a.penalties[g]=Number(b.dataset.val);saveState();const scroll=b.closest('.gate-scroll');if(scroll){const card=b.closest('.gate-card');const p=a.penalties[g]||0;card.querySelector('small').textContent='+'+p+' s';card.querySelectorAll('[data-action=pen]').forEach(btn=>btn.classList.toggle('chosen',Number(btn.dataset.val)===p&&p!==0))}const summary=$('pen-'+a.id),total=$('total-'+a.id),expand=b.closest('.card').querySelector('.expand span');if(summary)summary.textContent='Strafzeit: +'+pen(a)+' s';if(total)total.textContent='Gesamt: '+fmt(elapsed(a)+pen(a)*1000);if(expand)expand.textContent=Object.keys(a.penalties).length+' Fehler ⌃';return}else if(action==='delete'){if(!confirm(`Sportler ${a.name} wirklich löschen? Auch alle ${a.runs.length} gespeicherten Läufe werden dauerhaft aus der Rangliste und den Ergebnissen entfernt.`))return;data.athletes=data.athletes.filter(x=>x.id!==id)}else if(action==='add'){let id=Math.max(0,...data.athletes.map(a=>a.id))+1;data.athletes.push(newAthlete(id,`Sportler ${data.athletes.length+1}`))}else if(action==='count'){data.gateCount=Math.max(1,Math.min(25,data.gateCount+Number(b.dataset.delta)))}else if(action==='color'){let gate=data.gates.find(x=>x.id===g);gate.up=!gate.up}else if(action==='resetgates'){data.gates.forEach((g,i)=>{g.up=false;g.num=String(i+1).padStart(2,'0')})}else if(action==='pdf'){exportPDF();return}else if(action==='resetall'){if(!confirm('ACHTUNG: Alle Sportler, Laufzeiten, Torfehler und die Streckenkonfiguration werden unwiderruflich gelöscht. App wirklich komplett zurücksetzen?'))return;if(!confirm('Letzte Bestätigung: Alle gespeicherten Ergebnisse dauerhaft löschen?'))return;data=defaults();tab='timing';try{localStorage.removeItem(KEY)}catch(e){alert('Lokale Daten konnten nicht gelöscht werden.');return}saveState();render();return}saveState();render()});
document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.name){athlete(Number(el.dataset.name)).name=el.value;saveState()}else if(el.dataset.gatenum){let v=el.value.replace(/\D/g,'').slice(0,2).padStart(2,'0');data.gates.find(g=>g.id===Number(el.dataset.gatenum)).num=v;saveState();render()}});
setInterval(()=>{if(tab==='timing'){for(const a of data.athletes){let c=$('clock-'+a.id),t=$('total-'+a.id);if(c)c.textContent=fmt(elapsed(a));if(t)t.textContent='Gesamt: '+fmt(elapsed(a)+pen(a)*1000)}}},50);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState()});window.addEventListener('pagehide',saveState);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
